name: Discord-notificatie zakjes klaar

on:
  schedule:
    - cron: '7,37 * * * *'   # backup, 2x/uur — GitHub's eigen schedule is onbetrouwbaar bij korte intervallen
  workflow_dispatch: {}       # handmatig via de Actions-tab, EN het echte 5-min-ritme via een externe pinger (cron-job.org) die dit endpoint aanroept

permissions:
  contents: write

concurrency:
  group: discord-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Brussels    # zelfde tijdzone als de website (browser-lokale tijd van de leden)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check wachtrij en meld klare zakjes
        run: node .github/scripts/discord-notify.mjs

      # agenda-bot: nieuwe activiteiten posten, antwoorden bijhouden, herinneringen (24u/2u) per DM
      # (doet niets zolang de secrets niet ingesteld zijn; een fout hier stopt de zakjes-melding niet)
      - name: Agenda-bot (Discord)
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_AGENDA_CHANNEL_ID: ${{ secrets.DISCORD_AGENDA_CHANNEL_ID }}
        run: node .github/scripts/agenda-bot.mjs

      - name: Bewaar meld-status
        run: |
          git add .github/state/discord-notified.json
          if ! git diff --cached --quiet; then
            git config user.name "wietloods-bot"
            git config user.email "actions@github.com"
            git commit -m "chore: discord meld-status bijwerken"
            git push
          else
            echo "Geen wijziging in meld-status."
          fi
