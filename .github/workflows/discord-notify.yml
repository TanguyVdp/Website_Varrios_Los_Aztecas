name: Discord-notificatie zakjes klaar

on:
  schedule:
    - cron: '7,37 * * * *'   # backup, 2x/uur — GitHub's eigen schedule is onbetrouwbaar bij korte intervallen
  workflow_dispatch: {}       # handmatig via de Actions-tab, EN het echte 5-min-ritme via een externe pinger (cron-job.org) die dit endpoint aanroept

permissions:
  contents: write

concurrency:
  group: discord-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Brussels    # zelfde tijdzone als de website (browser-lokale tijd van de leden)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check wachtrij en meld klare zakjes
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node .github/scripts/discord-notify.mjs

      # agenda-bot: nieuwe activiteiten posten, antwoorden bijhouden, herinneringen als tag in het agenda-kanaal (24u + 5u: geen antwoord, 2u: aanwezig)
      # (doet niets zolang de secrets niet ingesteld zijn; een fout hier stopt de zakjes-melding niet)
      - name: Agenda-bot (Discord)
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_AGENDA_CHANNEL_ID: ${{ secrets.DISCORD_AGENDA_CHANNEL_ID }}
          DISCORD_MEDEDELINGEN_CHANNEL_ID: ${{ secrets.DISCORD_MEDEDELINGEN_CHANNEL_ID }}
          DISCORD_MEDEDELINGEN_ROLE_ID: ${{ secrets.DISCORD_MEDEDELINGEN_ROLE_ID }}
          DISCORD_AMFI_CHANNEL_ID: '1569308317237645342'   # lead-kanaal voor amfi-tickets (kanaal-ID is niet geheim)
          DISCORD_AFWEZIG_CHANNEL_ID: '1572374556838985820'   # #afwezigheid: meld-knop, meldingen en rol Afwezig
          DISCORD_AANWEZIG_ROLE_ID: '1573020053991989390'     # rol Aanwezig: iedereen (met Discord gekoppeld) die vandaag niet afwezig is
          DISCORD_AFWEZIG_ROLE_ID: '1573020186783518820'      # rol Afwezig: wie vandaag afwezig is (melding niet afgekeurd)
          DISCORD_LOODS_CHANNEL_ID: '1574880567013412874'     # loods-missies: elke dag een nieuw bericht (handelaar/skylift/terrorbite + base)
        # eerst de nieuwste state ophalen (een run die in de wachtrij stond, heeft anders een oude sollicitaties.json)
        run: |
          git fetch -q origin main && git checkout origin/main -- .github/state/sollicitaties.json 2>/dev/null || true
          node .github/scripts/agenda-bot.mjs

      - name: Bewaar meld-status
        run: |
          git add .github/state/discord-notified.json
          git add .github/state/sollicitaties.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "wietloods-bot"
            git config user.email "actions@github.com"
            git commit -m "chore: discord meld-status bijwerken"
            git push
          else
            echo "Geen wijziging in meld-status."
          fi
